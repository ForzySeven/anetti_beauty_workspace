{% extends 'salon/base.html' %}

{% block content %}
<div class="glass-container">
    <h1 class="title">Anetti Beauty</h1>
    <div class="subtitle">
        <span>📍</span> Робочий простір майстра
    </div>

    <form method="POST">
        {% csrf_token %}
        <label class="form-label">Хто працює з блокнотом?</label>

        <select name="master_id" required>
            <option value="" disabled selected>Оберіть майстра...</option>
            {% for master in masters %}
                <option value="{{ master.id }}">{{ master.name }}</option>
            {% endfor %}
        </select>

        <button type="submit" class="btn-burgundy">Увійти в блокнот</button>
    </form>
</div>
{% endblock %}
